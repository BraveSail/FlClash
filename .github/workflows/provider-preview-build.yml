name: provider preview build

on:
  push:
    branches:
      - feat/provider-yaml-preview
  workflow_dispatch:
    inputs:
      arch:
        description: Android ABI to build
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - amd64
          - all
      env:
        description: App environment
        required: false
        default: pre
        type: choice
        options:
          - pre
          - stable

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ github.event.inputs.arch || 'arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Setup Android signing
        env:
          KEYSTORE_B64: ${{ secrets.NAGRAM_RELEASE_KEYSTORE || secrets.KEYSTORE }}
          NAGRAM_LOCAL_PROPERTIES_B64: ${{ secrets.NAGRAM_LOCAL_PROPERTIES || secrets.LOCAL_PROPERTIES }}
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON }}
          KEY_ALIAS: ${{ secrets.NAGRAM_KEY_ALIAS || secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.NAGRAM_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NAGRAM_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks

            if [ -n "$NAGRAM_LOCAL_PROPERTIES_B64" ]; then
              echo "$NAGRAM_LOCAL_PROPERTIES_B64" | base64 --decode > /tmp/nagram-local.properties
              KEY_ALIAS="${KEY_ALIAS:-$(sed -n 's/^ALIAS_NAME=//p' /tmp/nagram-local.properties | tail -n1)}"
              STORE_PASSWORD="${STORE_PASSWORD:-$(sed -n 's/^KEYSTORE_PASS=//p' /tmp/nagram-local.properties | tail -n1)}"
              KEY_PASSWORD="${KEY_PASSWORD:-$(sed -n 's/^ALIAS_PASS=//p' /tmp/nagram-local.properties | tail -n1)}"
            fi

            if [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && \
              keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              {
                echo "keyAlias=$KEY_ALIAS"
                echo "storePassword=$STORE_PASSWORD"
                echo "keyPassword=$KEY_PASSWORD"
              } >> android/local.properties
            else
              echo "::warning::Nagram keystore was provided, but matching signing properties were not available or did not validate. Building with FlClash debug signing instead."
              rm -f android/app/keystore.jks android/local.properties
            fi
          fi
          if [ -n "$SERVICE_JSON_B64" ]; then
            echo "$SERVICE_JSON_B64" | base64 --decode > android/app/google-services.json
          fi

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build Android artifact
        run: |
          BUILD_ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          BUILD_ENV="${{ github.event.inputs.env || 'pre' }}"
          if [ "$BUILD_ARCH" = "all" ]; then
            dart setup.dart android --env "$BUILD_ENV"
          else
            dart setup.dart android --arch "$BUILD_ARCH" --env "$BUILD_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ github.event.inputs.arch || 'arm64' }}-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true
