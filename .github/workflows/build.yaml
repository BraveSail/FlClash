name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-windows:
    if: github.repository == 'BraveSail/FlClash'
    name: Pinned Windows amd64 installer
    runs-on: Windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3512bc426aed70089193b17075be60b51023f46c
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build the repository's Inno Setup package and portable verifier
        shell: bash
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3512bc426aed70089193b17075be60b51023f46c
          test "$(git -C core/Clash.Meta rev-parse HEAD)" = 19e155f528404390eb772dad75d0593fb720766f
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
          flutter pub get
          dart tool/package.dart windows --env stable --targets exe,zip
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-3512bc42-windows-amd64
          path: dist/
          if-no-files-found: error
