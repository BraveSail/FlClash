name: stable build

env:
  FLUTTER_VERSION: '3.47.8'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      android_arch:
        description: Android ABI to build
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - amd64
          - all

permissions:
  contents: read

jobs:
  android:
    name: Android stable ${{ inputs.android_arch || 'arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Android signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Android release signing secrets are incomplete."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks

          if ! keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Android release signing secrets do not validate against the keystore."
            rm -f android/app/keystore.jks android/local.properties
            exit 1
          fi

          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

          if [ -n "${SERVICE_JSON_B64:-}" ]; then
            echo "$SERVICE_JSON_B64" | base64 --decode > android/app/google-services.json
          fi

          echo "Android release signing configured."

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      - name: Name the hub in the build config
        shell: bash
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HUB_URL:-}" ]; then
            echo "HUB_URL is unset; the build will not name a hub" >&2
            exit 1
          fi
          printf 'hub_url: "%s"\n' "$HUB_URL" >> build_config.yaml
          grep -n '^hub_url:' build_config.yaml
      - name: Build Android stable artifact
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          BUILD_ARCH: ${{ inputs.android_arch || 'arm64' }}
          # The hub this build belongs to. The core reads it at link time and
          # takes its configuration from there, so the app carries no address,
          # no token and no idea that a mesh exists.
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ARCH" = "all" ]; then
            dart setup.dart android --env stable
          else
            dart setup.dart android --arch "$BUILD_ARCH" --env stable
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-stable-android-${{ inputs.android_arch || 'arm64' }}-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  windows:
    name: Windows stable amd64
    runs-on: Windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      - name: Name the hub in the build config
        shell: bash
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HUB_URL:-}" ]; then
            echo "HUB_URL is unset; the build will not name a hub" >&2
            exit 1
          fi
          printf 'hub_url: "%s"\n' "$HUB_URL" >> build_config.yaml
          grep -n '^hub_url:' build_config.yaml
      - name: Build Windows stable artifact
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: dart setup.dart windows --env stable

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-stable-windows-amd64-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  ont:
    name: ONT core linux armv5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Name the hub in the core
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HUB_URL:-}" ]; then
            echo "HUB_URL is unset; the core would not name a hub" >&2
            exit 1
          fi
          echo "hub: ${HUB_URL}"

      # The ONT runs a standalone core, not the app's IPC wrapper: it has no
      # Flutter, no helper and no TUN. easytier's overlay is the one part that
      # cannot cross to a 32-bit ARMv5 userland, so the build leaves it out.
      - name: Build ONT core
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          set -euo pipefail
          cd core/Clash.Meta
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -tags "no_easytier" -trimpath \
            -ldflags "-w -s -X 'github.com/metacubex/mihomo/constant.HubURL=${HUB_URL}'" \
            -o ../../dist/mihomo-ont-armv5 .
          cd ../../dist
          sha256sum mihomo-ont-armv5 > mihomo-ont-armv5.sha256
          ls -l mihomo-ont-armv5
          file mihomo-ont-armv5 || true
          grep -c "${HUB_URL}" mihomo-ont-armv5 || echo "hub string not found"

      - name: Upload ONT core
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ont-armv5-${{ github.sha }}
          path: ./dist/mihomo-ont-armv5*
          if-no-files-found: error
          overwrite: true
