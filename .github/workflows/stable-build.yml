name: stable build

on:
  push:
    branches:
      - feat/provider-yaml-preview
  workflow_dispatch:
    inputs:
      android_arch:
        description: Android ABI to build
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - amd64
          - all

permissions:
  contents: read

jobs:
  android:
    name: Android stable ${{ inputs.android_arch || 'arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Setup Android signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Android release signing secrets are incomplete."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks

          if ! keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Android release signing secrets do not validate against the keystore."
            rm -f android/app/keystore.jks android/local.properties
            exit 1
          fi

          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

          if [ -n "${SERVICE_JSON_B64:-}" ]; then
            echo "$SERVICE_JSON_B64" | base64 --decode > android/app/google-services.json
          fi

          echo "Android release signing configured."

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build Android stable artifact
        env:
          BUILD_ARCH: ${{ inputs.android_arch || 'arm64' }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ARCH" = "all" ]; then
            dart setup.dart android --env stable
          else
            dart setup.dart android --arch "$BUILD_ARCH" --env stable
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-stable-android-${{ inputs.android_arch || 'arm64' }}-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  windows:
    name: Windows stable amd64
    runs-on: Windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build Windows stable artifact
        run: dart setup.dart windows --arch amd64 --env stable

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-stable-windows-amd64-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true
